name: ci
# Unit tests + pinned-mirror verification.  Runs on every pull request and on main.
on:
  pull_request: {branches: [main]}
  push: {branches: [main]}
  schedule: [{cron: '17 6 * * 1'}]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -r requirements.txt
      - name: Unit tests (metric, emission, submission format)
        run: python -m pytest tests -q
  mirrors:
    # The mirrors are owner-hosted; if a byte changes, the digest check fails and nothing silently
    # enters a submission.  This job is the alarm.
    runs-on: ubuntu-latest
    env: {GH_TOKEN: '${{ github.token }}'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install numpy rasterio
      - run: python scripts/fetch_data.py --dest /tmp/gemsdoe72/data
