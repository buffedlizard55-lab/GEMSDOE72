name: Publish site and refresh leaderboard snapshot

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 12 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Assemble static site
        run: |
          mkdir -p site/docs
          cp index.html site/index.html
          cp docs/* site/docs/
      - name: Refresh official public leaderboard snapshot
        id: refresh
        continue-on-error: true
        run: python scripts/refresh_leaderboard.py --output site/docs/leaderboard.json
      - name: Report stale-snapshot fallback
        if: steps.refresh.outcome == 'failure'
        run: echo '::warning::Could not refresh the official leaderboard; deploying the last checked-in snapshot with its original timestamp.'
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
