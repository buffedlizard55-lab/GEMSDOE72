# statically and the site is static HTML in docs/. Reintroduce automation here when a
# maintainer reimplements the fetch steps against the official sources.
on:
  schedule: [{cron: '23 5 * * *'}]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  feed:
    runs-on: ubuntu-latest
    steps:
      - name: reserved no-op
        run: echo "feed workflow reserved; no automated fetch steps in GEMSDOE72"
